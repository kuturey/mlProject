<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Оценка недвижимости</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('/static/images/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 1300px;
            background: rgba(255, 255, 255, 0.6);
            padding: 100px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
            text-align: center;
        }
        h1 {
            color: #000000;
            font-size: 68px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        p {
            color: #000000;
            line-height: 1.8;
            font-size: 40px;
            margin-bottom: 30px;
             text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #D2B48C 0%, #8B4513 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 46px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏠 Оценка стоимости недвижимости</h1>
        <p>Введите характеристики объекта и получите его примерную стоимость с помощью машинного обучения</p>
        <a href="{% url 'evaluate' %}" class="btn">Начать оценку →</a>
    </div>
</body>
</html>
