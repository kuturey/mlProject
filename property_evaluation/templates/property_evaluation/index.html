<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Оценка недвижимости</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }
        .btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Оценка стоимости недвижимости</h1>
        <p>Введите характеристики объекта и получите его примерную стоимость</p>
        <a href="{% url 'evaluate' %}" class="btn">Начать оценку</a>
    </div>
</body>
</html>
